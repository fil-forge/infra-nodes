# Dependency update pull requests, for the two things here that have versions
# somebody else controls: the actions the workflows run, and the AWS provider
# both OpenTofu roots resolve.
#
# No commit-message prefix on either. Dependabot's default subject is "Bump X
# from A to B", which already matches this repository's imperative, unprefixed
# style.
#
# The container images are deliberately absent. They live as digest-pinned
# variables in nodes/*/platform/versions.env and nodes/*/apps/versions.env,
# which no ecosystem reads: the docker ecosystem wants a Dockerfile and the
# compose files here name `${PIRI_IMAGE}` rather than a registry reference.
#
# Piri and Ingot need no ecosystem anyway. Each dispatches its new digest here
# when it publishes, and .github/workflows/bump-deployed-image.yml opens the
# pull request. The platform images stay on mutable tags and are a hand edit.
version: 2

updates:
  # The workflows pin every action to a commit SHA, which is the only reference
  # an action cannot move underneath us — a tag can be repointed at new code by
  # whoever owns the action. The cost is that a pin never updates itself, not
  # even for a security fix, so something has to open that pull request. This is
  # that something.
  #
  # Weekly, and grouped into one pull request: these are build-time tooling with
  # no runtime coupling to each other, so reviewing them together costs nothing
  # and reviewing them apart costs several rounds of CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: America/New_York
    groups:
      actions:
        patterns: ["*"]

  # The AWS provider each root requires in its versions.tofu, and the version
  # each root's .terraform.lock.hcl resolved it to.
  #
  # Dependabot ships a separate `terraform` ecosystem, and `opentofu` is the one
  # that fits these roots. It reads .tofu files as well as .tf, it resolves
  # against registry.opentofu.org, which is the hostname these lock files key
  # on, and it rewrites them with `tofu providers lock`. The terraform ecosystem
  # does none of the three, and pointed here it would find no provider at all:
  # the only thing in a versions.tf in this repository is the constraint that
  # stops Terraform.
  #
  # The bootstrap entry is a glob, so a second bootstrap region is covered the
  # day someone adds it. `dev` is listed literally: a glob over `/terraform/
  # envs/*` would also match envs/bootstrap, which holds no configuration of its
  # own, and a second stage needs a line here.
  #
  # Grouped by dependency name, which is what collapses a provider bump across
  # both roots into a single pull request. A plain `patterns` group has no
  # effect here: grouping happens within each directory, so it would still open
  # two.
  - package-ecosystem: opentofu
    directories:
      - /terraform/envs/dev
      - /terraform/envs/bootstrap/*
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"
      timezone: America/New_York
    groups:
      opentofu:
        patterns: ["*"]
        group-by: dependency-name
