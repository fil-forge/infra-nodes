# Keeps one pull request that promotes dev's images to staging, and never
# merges it: merging it is how a person promotes.
#
# Test nodes calls this after a push to main, once dev has reached the pushed
# commit and passed its smoke and end-to-end tests. The pull request is built
# on that commit, so it only ever proposes pins dev has passed with. A dev
# bump landing changes what it proposes; any other push only moves it onto
# that commit, which the ruleset requires before it can merge. A manual run
# rebuilds it on current main without waiting for dev.
#
# What it opens, refreshes and closes: scripts/ci/promote.sh, which also keeps
# prod's pull requests for promote-prod.yml. The dev check:
# scripts/ci/node-passed.sh.
name: Promote to staging

on:
  workflow_call:
    secrets:
      FORGE_BOT_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    name: Promote dev's images to staging
    # A promotion pull request targets main, and only main's history carries
    # the dev bumps its change list is read from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To read the outcome of the Test nodes jobs in the calling run.
      actions: read
    # One at a time. Two runs would force-push the branch from two different
    # commits, and the pull request would show whichever lost. A literal
    # prefix, because under workflow_call github.workflow names the caller.
    concurrency:
      group: promote-staging
      cancel-in-progress: false
    steps:
      # Not GITHUB_TOKEN: a pull request it opens or a push it makes starts no
      # workflows, so the checks the pull request needs would never run.
      - name: Mint fil-forge-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FORGE_BOT_APP_ID }}
          private-key: ${{ secrets.FORGE_BOT_PRIVATE_KEY }}

      # The commit dev was tested on, not main's tip: main may have moved past
      # it to pins dev has not passed with yet. Full history, because each
      # pin's source commit is read off the dev bump that first carried its
      # digest.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      # Under workflow_call the event is the caller's push, and github.run_id
      # the Test nodes run, whose test jobs have all ended by now. A manual run
      # has no test to wait for.
      - name: Check that dev passed Test nodes
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/ci/node-passed.sh "$RUN_ID" dev

      - name: Open, refresh or close the promotion
        if: github.event_name != 'push' || steps.gate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          APP_SLUG: ${{ steps.bot.outputs.app-slug }}
          BASE: ${{ github.sha }}
          TEST_RUN_URL: >-
            ${{ github.event_name == 'push'
            && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id)
            || '' }}
        run: scripts/ci/promote.sh staging
