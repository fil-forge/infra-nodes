# Checks that the dev and staging nodes are serving what main pins.
#
# A merge queues an image rather than deploying it: the node picks it up on its
# next reconcile pass and can spend 45 minutes in the proving gate before Piri
# restarts. So the run that merges a bump ends long before the node runs it, and
# nothing else would tell us a merged image is broken. This waits for the node to
# reach the commit, then tests it.
name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Off the hour, so a node that stops answering between merges is noticed
  # within the hour rather than at the next merge.
  schedule:
    - cron: "17 * * * *"

# Per trigger, so a push supersedes an older push and nothing else. A wait can
# legitimately run for an hour, and one group for every trigger would let the
# hourly schedule cancel it: the scheduled run would then find the node on the
# previous image, pass, and alert nothing, which is the gap this workflow exists
# to close.
concurrency:
  group: smoke-nodes-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per node, waiting and testing in the same job, so each node's smoke
  # test is gated only by its own wait. Split across two jobs, the smoke job
  # could only read the matrix-wide result of the wait job, and one node that
  # never got the commit would skip the test on the node that did.
  #
  # The alert lives here too, for the same reason: only inside the job can it
  # name the node and say which step failed. So does starting the end-to-end
  # test, which only a node that passed its smoke test gets.
  smoke:
    name: Smoke test
    strategy:
      fail-fast: false
      matrix:
        node: [dev, staging/eu-central-3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To dispatch e2e.yml.
      actions: write
    # The wait budget below, the smoke retries, and room for the checkout and a
    # slow first poll. Both steps stop themselves well inside it; a job that
    # hits this timeout is cancelled, and the alert steps do not run on a
    # cancel.
    timeout-minutes: 85
    steps:
      # fetch-depth: 0 because the ancestor test needs both commits in the
      # checkout, and the node can be several commits behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only a push has a commit to wait for. A schedule and a manual run check
      # the node as it stands.
      - name: Poll the node's status document
        id: wait
        if: github.event_name == 'push'
        env:
          COMMIT: ${{ github.sha }}
          NODE: ${{ matrix.node }}
        run: |
          set -euo pipefail
          # Every Piri hostname serves the document. piri-0 is the one a node
          # running one Piri per storage volume always has; a node with a
          # single Piri still names its hostname in PIRI_HOSTNAME.
          suffix=$(sed -nE 's/^PIRI_HOSTNAME_SUFFIX=(.*)$/\1/p' "nodes/$NODE/node.env" | tail -1)
          if [ -n "$suffix" ]; then
            host="piri-0.$suffix"
          else
            host=$(sed -nE 's/^PIRI_HOSTNAME=(.*)$/\1/p' "nodes/$NODE/node.env" | tail -1)
          fi
          [ -n "$host" ] || { echo "::error::no PIRI_HOSTNAME_SUFFIX or PIRI_HOSTNAME in nodes/$NODE/node.env"; exit 1; }
          url="https://$host/.well-known/filone-node-status.json"
          deadline=$(( $(date +%s) + 60 * 60 ))
          echo "waiting for $NODE at $url to report ${COMMIT:0:7} or a descendant"
          while :; do
            # reconcile, not apps: it is stamped on every pass, so a commit
            # that deployed neither project still advances it. apps would sit
            # still and this would wait out the full hour on a docs merge.
            reported=$(curl --silent --max-time 10 --fail "$url" 2>/dev/null \
              | jq -r '.projects.reconcile.revision // empty' 2>/dev/null || true)

            if [ -z "$reported" ]; then
              echo "  no revision reported yet"
            elif ! git cat-file -e "$reported^{commit}" 2>/dev/null; then
              echo "  reports $reported, which is not in this checkout"
            elif git merge-base --is-ancestor "$COMMIT" "$reported"; then
              echo "  the node is on ${reported:0:7}"
              break
            else
              echo "  still on ${reported:0:7}"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$NODE did not reach ${COMMIT:0:7} within 60 minutes"
              exit 1
            fi
            sleep 60
          done

      # A failed wait skips this by default: the node never got the commit, so
      # testing it would report on the previous one.
      #
      # Retried, so one slow TLS handshake is not an alert. Piri restarts as
      # part of the deploy the wait above observed, and the node's own health
      # gate has already passed by then, so this is about the network rather
      # than about the node still coming up.
      - name: Run the smoke test
        id: smoke
        env:
          # Only on a push: a schedule and a manual run check the node as it
          # stands, against whatever revision it reports.
          REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
          NODE: ${{ matrix.node }}
        run: |
          set -uo pipefail
          args=($NODE)
          [ -z "$REVISION" ] || args+=(--revision "$REVISION")
          passed=false
          for attempt in 1 2 3 4 5; do
            echo "::group::$NODE attempt $attempt"
            if scripts/ci/smoke-test.sh "${args[@]}"; then
              echo "::endgroup::"
              passed=true
              break
            fi
            echo "::endgroup::"
            [ "$attempt" -eq 5 ] || sleep 30
          done
          "$passed" || { echo "::error::$NODE did not pass: 5 attempts over 2 minutes"; exit 1; }

      # The node now runs this commit, so start the end-to-end test on it. Only
      # on a push: a schedule and a manual run deployed nothing, and e2e.yml has
      # a daily run of its own. A dispatch with GITHUB_TOKEN starts a run, unlike
      # most events that token triggers.
      #
      # The stage is the first part of the node's path. Dispatch covers every
      # node of the stage, which is the same thing while each stage has one.
      - name: Start the end-to-end test
        id: dispatch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ matrix.node }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          stage=${NODE%%/*}
          gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "stage=$stage" -f change_repo=infra-nodes -f "change_sha=$COMMIT" \
            -f "change_subject=$(git log -1 --format=%s)" -f "change_author=$ACTOR"
          echo "started the end-to-end test of $stage"

      # Each failure needs a different response, so the message says which one
      # happened: the node never reached the commit, it reached it and failed the
      # smoke test, or it passed and the end-to-end test could not be started.
      # The wait step's outcome is `skipped` on a schedule and a manual run, and
      # `failure` only when the node never arrived.
      - id: what
        if: failure()
        env:
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NODE: ${{ matrix.node }}
        run: |
          set -euo pipefail
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          if [ "$WAIT_OUTCOME" = failure ]; then
            echo "headline=The $NODE node never reached this commit" >> "$GITHUB_OUTPUT"
            echo "next=Check reconcile on the node: the proving gate, a failing deploy, or a node tracking another ref." >> "$GITHUB_OUTPUT"
          elif [ "$SMOKE_OUTCOME" = failure ]; then
            echo "headline=The $NODE node failed its smoke test" >> "$GITHUB_OUTPUT"
            echo "next=The node has this commit and is not serving it. Suspect the image it pinned." >> "$GITHUB_OUTPUT"
          else
            echo "headline=The $NODE node passed its smoke test, but its end-to-end test could not be started" >> "$GITHUB_OUTPUT"
            echo "next=The run log has the error from GitHub. Start the test by hand: gh workflow run e2e.yml --ref main -f stage=${NODE%%/*}" >> "$GITHUB_OUTPUT"
          fi

      # For a bump, the service commit that produced the image. Best-effort: the
      # script prints nothing on any failure, and the message below falls back
      # to the infra-nodes commit alone.
      #
      # The finished Slack line rather than its parts, so the payload below
      # interpolates one value and needs no markup of its own.
      - id: source
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          line=$(git log -1 --format=%B | scripts/ci/service-commit-line.sh)
          echo "line=$line" >> "$GITHUB_OUTPUT"

      # Every interpolation goes through toJSON, because the payload is JSON and
      # a commit subject is free to contain a quote or a backslash.
      - if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "filone-alerts",
              "text": ${{ toJSON(format('{0}. Commit: {1} by @{2}. {3}Details: {4}/{5}/actions/runs/{6}', steps.what.outputs.headline, steps.what.outputs.subject, github.actor, steps.source.outputs.line && format('{0}. ', steps.source.outputs.line) || '', github.server_url, github.repository, github.run_id)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':warning: *{0}* · <{1}/{2}/actions/runs/{3}|Details>', steps.what.outputs.headline, github.server_url, github.repository, github.run_id)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('Commit: `{0}` by <https://github.com/{1}|@{1}>', steps.what.outputs.subject, github.actor)) }}
                  }
                },
                ${{ steps.source.outputs.line && format('{{"type":"section","text":{{"type":"mrkdwn","text":{0}}}}},', toJSON(steps.source.outputs.line)) || '' }}
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.what.outputs.next) }}
                  }
                }
              ]
            }
