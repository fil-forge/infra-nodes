# What CI can check without an AWS account.
#
# There is no deploy job. A node deploys itself: it pulls origin/main every five
# minutes and runs the deploy scripts, so the thing CI protects is the branch
# those nodes are about to run, not a pipeline that pushes to them.
#
# Every job runs one Makefile target and nothing else, so `make check` on a
# laptop runs the same commands these jobs do. The three stay separate jobs
# because they run in parallel and each says which check failed.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.0"

      - run: make check-tofu

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: make check-shell

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: make check-compose
