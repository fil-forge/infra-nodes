name: filone-apps

services:
  piri:
    image: ${PIRI_IMAGE}
    container_name: filone-piri
    user: "0:0"
    entrypoint: ["/entrypoint.sh"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:15100:3000"]
    environment:
      LOTUS_ENDPOINT: ${LOTUS_RPC_URL}
      PUBLIC_URL: ${PIRI_PUBLIC_URL}
      PORT: 3000
      HOST: 0.0.0.0
      REGISTRAR_URL: ${REGISTRAR_URL}
      # Same variable Ingot's config is rendered from: one directory per host.
      PLC_DIRECTORY_URL: ${PLC_DIRECTORY_URL}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL}
      PIRI_DB_BACKEND: postgres
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri?sslmode=disable
      PIRI_BLOB_BACKEND: filesystem
    volumes:
      # Rendered from OpenBao into a root-only tmpfs by deploy-apps.sh. Nothing
      # here survives a reboot, so when Docker restarts this container at boot
      # the files are missing. create_host_path: false makes that a start that
      # fails; the default would put an empty directory where each file belongs,
      # and every later render would land inside it. Run deploy-apps.sh after a
      # reboot to render the files and recreate the container.
      - type: bind
        source: /run/fil-one/secrets/piri.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-base-config.toml
        target: /config/piri-base-config.toml
        read_only: true
        bind:
          create_host_path: false
      - ./config/piri/entrypoint.sh:/entrypoint.sh:ro
      - /mnt/data/fil-one/data/piri:/data/piri
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/readyz | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    networks: [filone]

  ingot:
    image: ${INGOT_IMAGE}
    container_name: filone-ingot
    user: "0:0"
    command: ["serve", "--config", "/etc/ingot/config.yaml"]
    ports: ["127.0.0.1:15200:9000"]
    volumes:
      # Same tmpfs, same create_host_path reason, as Piri's mounts above.
      - type: bind
        source: /run/fil-one/secrets/ingot.pem
        target: /keys/ingot.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/ingot-config.yaml
        target: /etc/ingot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/hilt-ingot-proof.txt
        target: /proofs/hilt-ingot-proof.txt
        read_only: true
        bind:
          create_host_path: false
      - /run/fil-one/bao:/run/openbao
      - /mnt/data/fil-one/data/ingot:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [filone]

networks:
  filone:
    external: true
