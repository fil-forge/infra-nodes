name: filone-apps

# What every Piri shares. Compose ignores a top-level key only when it starts
# with `x-`, which marks it as an extension field; the rest of the name is free.
# Each service below merges this in with `<<: *piri-base` and adds what is its
# own: its name, its port, its URL, its database, its key and wallet, and its
# directory on the data disk.
x-piri-base: &piri-base
  image: ${PIRI_IMAGE}
  user: "0:0"
  entrypoint: ["/entrypoint.sh"]
  extra_hosts: ["host.docker.internal:host-gateway"]
  # Where `piri init` writes its config, which holds the chain RPC token. The
  # entrypoint copies it to the data disk without the token.
  tmpfs: ["/run/piri-init:mode=0700"]
  environment: &piri-environment
    # Piri reads both as overrides of its `[pdp]` config, so `piri serve`
    # dials this endpoint even when the piri-config.toml on the data disk was
    # generated for another one. The token is the raw value; Piri prepends
    # "Bearer ". The entrypoint keeps it out of the config on the data disk.
    PIRI_PDP_LOTUS_ENDPOINT: ${LOTUS_RPC_URL}
    PIRI_PDP_LOTUS_AUTH_TOKEN: ${CHAIN_RPC_TOKEN}
    PORT: 3000
    HOST: 0.0.0.0
    REGISTRAR_URL: ${REGISTRAR_URL}
    # Same variable Ingot's config is rendered from: one directory per host.
    PLC_DIRECTORY_URL: ${PLC_DIRECTORY_URL}
    OPERATOR_EMAIL: ${OPERATOR_EMAIL}
    PIRI_DB_BACKEND: postgres
    PIRI_BLOB_BACKEND: filesystem
    # Seconds a re-run of `piri init` may take before it is killed and the
    # existing config served. Set PIRI_INIT_TIMEOUT in node.env to change it.
    PIRI_INIT_TIMEOUT: ${PIRI_INIT_TIMEOUT:-300}
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/readyz | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
    start_interval: 2s
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 180s
  restart: unless-stopped
  networks: [filone]

services:
  # The key, wallet and base config are rendered from OpenBao into a root-only
  # tmpfs by deploy-apps.sh. Nothing there survives a reboot, so when Docker
  # restarts a container at boot the files are missing. create_host_path: false
  # makes that a start that fails; the default would put an empty directory
  # where each file belongs, and every later render would land inside it. Run
  # deploy-apps.sh after a reboot to render the files and recreate the
  # containers.
  piri-0:
    <<: *piri-base
    container_name: filone-piri-0
    ports: ["127.0.0.1:15100:3000"]
    environment:
      <<: *piri-environment
      PUBLIC_URL: https://piri-0.${PIRI_HOSTNAME_SUFFIX}
      # pool_max_conns sizes the PDP pipeline's connection pool (blob/accept
      # and the task scheduler), which otherwise defaults to one connection per
      # CPU core, minimum four. 16 per Piri keeps the three of them at 48 of
      # Postgres's default 100 connections, with the rest for Ingot and admin
      # sessions. The entrypoint passes the URL to `piri init`, which writes it
      # into the generated config. The entrypoint counts init's arguments among
      # its inputs, so a change here re-runs init on the next start.
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri_0?sslmode=disable&pool_max_conns=16
      # Names this Piri in its metrics and traces. Without it, instance is the
      # Piri's DID, and nothing says which DID is piri-0.
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${FILONE_NODE}/piri-0
    volumes:
      - type: bind
        source: /run/fil-one/secrets/piri-0.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-0-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - &piri-base-config
        type: bind
        source: /run/fil-one/secrets/piri-base-config.toml
        target: /config/piri-base-config.toml
        read_only: true
        bind:
          create_host_path: false
      - &piri-entrypoint ./config/piri/entrypoint.sh:/entrypoint.sh:ro
      - /mnt/data/fil-one/data/piri-0:/data/piri

  piri-1:
    <<: *piri-base
    container_name: filone-piri-1
    ports: ["127.0.0.1:15101:3000"]
    environment:
      <<: *piri-environment
      PUBLIC_URL: https://piri-1.${PIRI_HOSTNAME_SUFFIX}
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri_1?sslmode=disable&pool_max_conns=16
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${FILONE_NODE}/piri-1
    volumes:
      - type: bind
        source: /run/fil-one/secrets/piri-1.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-1-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - *piri-base-config
      - *piri-entrypoint
      - /mnt/data/fil-one/data/piri-1:/data/piri
    # The Piris start one at a time. `piri init` estimates gas for the
    # createDataSet transaction against the chain's pending state, and two
    # Piris estimating at once underestimate it: the loser's transaction
    # reverts out of gas (storacha/piri#466). deploy-apps.sh recreates them one
    # at a time anyway; this covers a first start and `docker compose up`.
    depends_on:
      piri-0:
        condition: service_healthy

  piri-2:
    <<: *piri-base
    container_name: filone-piri-2
    ports: ["127.0.0.1:15102:3000"]
    environment:
      <<: *piri-environment
      PUBLIC_URL: https://piri-2.${PIRI_HOSTNAME_SUFFIX}
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri_2?sslmode=disable&pool_max_conns=16
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${FILONE_NODE}/piri-2
    volumes:
      - type: bind
        source: /run/fil-one/secrets/piri-2.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-2-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - *piri-base-config
      - *piri-entrypoint
      - /mnt/data/fil-one/data/piri-2:/data/piri
    depends_on:
      piri-1:
        condition: service_healthy

  ingot:
    image: ${INGOT_IMAGE}
    container_name: filone-ingot
    user: "0:0"
    command: ["serve", "--config", "/etc/ingot/config.yaml"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      # Ingot exports traces and metrics over OTLP/HTTP only when an OTLP
      # endpoint is set, and logs "tracing off" and "metrics off" otherwise.
      # This one is the host's Alloy, through the Docker host gateway, as for
      # Piri.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      # Piri sets the same attribute from its base config's [telemetry]
      # environment, so one TraceQL filter tells the stages apart for both.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${STAGE}
    ports: ["127.0.0.1:15200:9000"]
    volumes:
      # Same tmpfs, same create_host_path reason, as Piri's mounts above.
      - type: bind
        source: /run/fil-one/secrets/ingot.pem
        target: /keys/ingot.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/ingot-config.yaml
        target: /etc/ingot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/hilt-ingot-proof.txt
        target: /proofs/hilt-ingot-proof.txt
        read_only: true
        bind:
          create_host_path: false
      - /run/fil-one/bao:/run/openbao
      - /mnt/data/fil-one/data/ingot:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [filone]

networks:
  filone:
    external: true
