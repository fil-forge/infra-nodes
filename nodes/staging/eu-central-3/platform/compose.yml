name: filone-platform

services:
  openbao:
    image: ${OPENBAO_IMAGE}
    container_name: filone-openbao
    user: "0:0"
    command: ["server", "-config=/etc/openbao/bao.hcl"]
    environment: ["VAULT_TRANSIT_SEAL_TOKEN=${SEAL_TOKEN}"]
    volumes:
      - ./config/openbao/bao.hcl:/etc/openbao/bao.hcl:ro
      # create_host_path: false so a start fails when the volume is not mounted,
      # including Docker's own restart at boot, instead of running on an empty
      # directory on the root disk.
      - type: bind
        source: /mnt/data/fil-one/control/openbao
        target: /openbao/file
        bind:
          create_host_path: false
      - /run/fil-one/bao:/openbao/logs
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Limits give the capacity alerts a denominator and keep one service from
    # starving the shared host. Sized well above observed peaks (FIL-1214).
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Read only when the data directory is empty. C.UTF-8 sorts by code
      # point, the order the cluster had under the Alpine image's musl.
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
    # Every WAL segment goes to the backup bucket by WAL-G, and a segment is
    # cut at least every 60 seconds while anything writes, which bounds what a
    # restore from the archive can lose. A segment that fails to upload stays
    # in pg_wal and is retried; the archive metrics and their alerts watch for
    # it. filone-postgres-backup.timer takes the base backups.
    #
    # versions.env turns archiving on beside the image, because WAL-G runs only
    # under the Debian image's glibc. migrate-postgres-to-debian.sh turns it off
    # for the clusters it starts by hand: the old one under Alpine, and the new
    # one while it restores into it.
    #
    # filone-wal-push runs WAL-G with the config rendered for this cluster
    # alone (config/postgres/wal-push.sh says why). It is given the pinned
    # version, so a new pin changes this service's definition, and the deploy
    # that takes it recreates Postgres to run it.
    command:
      - postgres
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_command=/usr/local/bin/filone-wal-push ${WALG_VERSION:?node.env pins WALG_VERSION on a node that takes backups} %p
      - -c
      - archive_timeout=60
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      # install-tools.sh installs each pinned WAL-G under a directory of its
      # version here. The directory rather than the binary, and one Docker may
      # create, so that Postgres starts before WAL-G is installed: the archive
      # then fails, and alerts, instead of the platform.
      - type: bind
        source: /usr/local/lib/fil-one/wal-g
        target: /opt/wal-g
        read_only: true
      - ./config/postgres/wal-push.sh:/usr/local/bin/filone-wal-push:ro
      # WAL-G's config, rendered from filone/backup-target in OpenBao on every
      # reconcile pass, one file per cluster. The directory rather than a file,
      # and one Docker may create: tmpfs is empty after a reboot, and Postgres
      # has to start before a pass renders the file again
      # (scripts/host/lib/walg.sh).
      - type: bind
        source: /run/fil-one/walg
        target: /etc/wal-g
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d admin"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Same reason as openbao's limits above.
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
    networks: [filone]

  postgres-init:
    image: ${POSTGRES_IMAGE}
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_ADMIN_PASSWORD"
        ensure_role() { printf '%s\n' "SELECT 'CREATE ROLE \"$$1\"' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$$1')" '\gexec' "ALTER ROLE \"$$1\" WITH LOGIN PASSWORD '$$2';" | psql -h postgres -U admin -d admin -v ON_ERROR_STOP=1 --quiet; }
        ensure_database() { printf '%s\n' "SELECT 'CREATE DATABASE \"$$1\" OWNER \"$$2\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$1')" '\gexec' | psql -h postgres -U admin -d admin -v ON_ERROR_STOP=1 --quiet; }
        # One role for every Piri, and one database each, named after its
        # compose service with _ for - so a one-off query needs no quoting.
        ensure_role piri "$$PIRI_POSTGRES_PASSWORD"
        ensure_database piri_0 piri
        ensure_database piri_1 piri
        ensure_database piri_2 piri
        ensure_role ingot "$$INGOT_POSTGRES_PASSWORD"
        ensure_database ingot ingot
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PIRI_POSTGRES_PASSWORD: ${PIRI_POSTGRES_PASSWORD}
      INGOT_POSTGRES_PASSWORD: ${INGOT_POSTGRES_PASSWORD}
    restart: "no"
    networks: [filone]

networks:
  filone:
    external: true
