name: filone-apps

# One Piri and Ingot, and the import service. The Caddy in the platform project
# reaches Piri and Ingot over the filone network, so neither publishes a port.
#
# One Piri. An appliance runs one Piri per storage volume
# (docs/decisions/2026-10-multiple-piri-per-appliance.md), and this node has
# one: the object storage its Piri is to use. It is piri-0, by the naming that
# record sets, so a second can join without renaming the first.

x-piri-base: &piri-base
  image: ${PIRI_IMAGE}
  user: "0:0"
  entrypoint: ["/entrypoint.sh"]
  # Where `piri init` writes its config, which holds the chain RPC token. The
  # entrypoint copies it to the data dataset without the token.
  tmpfs: ["/run/piri-init:mode=0700"]
  environment: &piri-environment
    # Overrides of Piri's `[pdp]` config; see the dev node's compose.yml. The
    # token is the raw value; Piri prepends "Bearer ".
    PIRI_PDP_LOTUS_ENDPOINT: ${LOTUS_RPC_URL}
    PIRI_PDP_LOTUS_AUTH_TOKEN: ${CHAIN_RPC_TOKEN}
    PORT: 3000
    HOST: 0.0.0.0
    REGISTRAR_URL: ${REGISTRAR_URL}
    # Same variable Ingot's config is rendered from: one directory per host.
    PLC_DIRECTORY_URL: ${PLC_DIRECTORY_URL}
    OPERATOR_EMAIL: ${OPERATOR_EMAIL}
    PIRI_DB_BACKEND: postgres
    # No PIRI_BLOB_BACKEND, which dev and staging set to filesystem: this
    # node's Piri keeps its blobs in object storage, set in the [repo.s3]
    # section of its base config, because the piri dataset's 50 GiB quota is
    # sized for its config and state.
    # Seconds a re-run of `piri init` may take before it is killed and the
    # existing config served. Set PIRI_INIT_TIMEOUT in node.env to change it.
    PIRI_INIT_TIMEOUT: ${PIRI_INIT_TIMEOUT:-300}
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/readyz | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
    start_interval: 2s
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 180s
  # Limits give the capacity alerts a denominator and keep one service from
  # starving the shared host. Staging's sizes (FIL-1214).
  mem_limit: 2g
  cpus: 2
  restart: unless-stopped
  networks: [filone]

services:
  # The key, wallet and base config are rendered from OpenBao into a root-only
  # tmpfs by deploy-apps.sh; create_host_path: false makes a start after a
  # reboot fail until the first reconcile pass renders them. See the staging
  # node's compose.yml.
  piri-0:
    <<: *piri-base
    container_name: filone-piri-0
    environment:
      <<: *piri-environment
      PUBLIC_URL: https://piri-0.${PIRI_HOSTNAME_SUFFIX}
      # pool_max_conns sizes the PDP pipeline's connection pool, as on staging.
      # The entrypoint counts init's arguments among its inputs, so a change
      # here re-runs init on the next start.
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri_0?sslmode=disable&pool_max_conns=16
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${FILONE_NODE}/piri-0
    volumes:
      - type: bind
        source: /run/fil-one/secrets/piri-0.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-0-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-base-config.toml
        target: /config/piri-base-config.toml
        read_only: true
        bind:
          create_host_path: false
      - ./config/piri/entrypoint.sh:/entrypoint.sh:ro
      # A directory on the piri dataset rather than its mount point, as on dev:
      # it exists only on the dataset, so Docker refuses to start the Piri
      # without it. provision-apps.sh creates it on the empty dataset.
      - type: bind
        source: /mnt/data/fil-one/piri/piri-0
        target: /data/piri
        bind:
          create_host_path: false

  ingot:
    image: ${INGOT_IMAGE}
    container_name: filone-ingot
    user: "0:0"
    command: ["serve", "--config", "/etc/ingot/config.yaml"]
    environment:
      # The node's Alloy, on the filone network, as on dev.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${STAGE}
    volumes:
      # Same tmpfs, same create_host_path reason, as the Piri's mounts above.
      - type: bind
        source: /run/fil-one/secrets/ingot.pem
        target: /keys/ingot.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/ingot-config.yaml
        target: /etc/ingot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/hilt-ingot-proof.txt
        target: /proofs/hilt-ingot-proof.txt
        read_only: true
        bind:
          create_host_path: false
      - /run/fil-one/bao:/run/openbao
      # Ingot keeps its cache in data_dir/cache and its catalog log in
      # data_dir/segments. The ingot/blobs dataset is data_dir, so the cache
      # is what INGOT_LOCAL_BLOB_MAX_BYTES budgets it for, and the
      # ingot/segments dataset is bound over data_dir/segments, so the
      # catalog log has a quota of its own.
      - type: bind
        source: /mnt/data/fil-one/ingot/blobs
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/fil-one/ingot/segments
        target: /data/segments
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Staging's sizes. Twice the Piri's CPU: Ingot reached 1.3 cores in the
    # 2026-09-24 load test.
    mem_limit: 2g
    cpus: 4
    restart: unless-stopped
    networks: [filone]

  # The import service. scripts/host/deploy-import.sh deploys it on its own,
  # after Piri and Ingot, and leaves it stopped while any of its settings in
  # node.env or its image pin in versions.env is still PLACEHOLDER; deploy-apps.sh
  # neither starts it nor waits for it. docs/runbook/set-up-import-service.md
  # has the provisioning steps.
  #
  # It terminates its own mutual TLS, because the client certificate's common
  # name is the key of its allow-list and of every record it writes, so Caddy
  # stays out of its path. Its port is published on IPv4 alone, and the host
  # firewall in front of it is scripts/host/import-firewall.sh, since UFW does not
  # filter a port Docker publishes. Boxes upload their packs to Ingot through
  # Caddy, as any S3 client does.
  #
  # On the filone network rather than the host's. The service refuses to listen
  # on the wildcard address, so it is given a fixed address there, which
  # deploy-import.sh derives from the network and passes in as
  # IMPORT_SERVICE_CONTAINER_ADDRESS. The ledger is in central's VPC, which it
  # reaches over the node's database VPN: scripts/host/setup-vpn.sh source-NATs
  # the filone network's traffic into the tunnels. It reads packs back from
  # Ingot over the same network.
  import-service:
    image: ${IMPORT_SERVICE_IMAGE}
    container_name: filone-import-service
    # The image's own user, stated so a rebuilt image cannot change it.
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "0.0.0.0:${IMPORT_SERVICE_PORT}:8443"
    environment:
      IST1_IMPORT_LISTEN_IP: ${IMPORT_SERVICE_CONTAINER_ADDRESS:-}
      IST1_IMPORT_PORT: "8443"
      IST1_IMPORT_TLS_CERT: /run/import/server.pem
      IST1_IMPORT_TLS_KEY: /run/import/server-key.pem
      IST1_IMPORT_CLIENT_CA: /run/import/client-ca.pem
      IST1_IMPORT_ALLOWED_CLIENTS: ${IMPORT_SERVICE_ALLOWED_CLIENTS}
      PGPASSFILE: /run/import/pgpass
      IST1_PACK_LEASE_HOLDER: ${IMPORT_SERVICE_LEASE_HOLDER}
      IST1_PACK_S3_BUCKET: ${IMPORT_SERVICE_S3_BUCKET}
      # Ingot over the filone network, as rag-engine reaches it on staging:
      # SigV4 signs the host the client contacts, so the key still verifies.
      IST1_PACK_S3_ENDPOINT: http://ingot:9000
      IST1_PACK_S3_REGION: ${REGION_LABEL}
      IST1_PACK_S3_PREFIX: ${IMPORT_SERVICE_S3_PREFIX:-}
      IST1_PACK_S3_PATH_STYLE: "1"
      IST1_PACK_S3_SECRET_KEY_FILE: /run/import/s3-secret-key
      # The site secret the pack keys derive from, which it reads once at start.
      IST1_PACK_SITE_SECRET: /run/import/site-secret
      IST1_PACK_RECOVERY_PUBLIC_KEY: ${IMPORT_SERVICE_RECOVERY_PUBLIC_KEY}
    # The ledger's DSN and the object store's access key id, rendered from
    # OpenBao by deploy-import.sh. Not required here so CI can validate this file
    # without it; the service does not start without them.
    env_file:
      - path: /run/fil-one/secrets/import-service.env
        required: false
    volumes:
      # Its certificate, key and client CA, the ledger's password file, the
      # object store's secret key and the site secret, rendered by
      # deploy-import.sh into the secrets tmpfs and owned by the service's user.
      # create_host_path: false makes a start after a reboot fail until that
      # deploy renders them, which it does only after loading the firewall table.
      - type: bind
        source: /run/fil-one/secrets/import-service
        target: /run/import
        read_only: true
        bind:
          create_host_path: false
    # The image's own healthcheck, stated here as the other services' are: a
    # TLS handshake with no client certificate, which the service refuses.
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/import-service-healthcheck"]
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      filone:
        ipv4_address: ${IMPORT_SERVICE_CONTAINER_ADDRESS:-}

networks:
  filone:
    external: true
