name: filone-apps

# One Piri and Ingot. The Caddy in the platform project reaches both over the
# filone network, so neither publishes a port.
#
# One Piri. An appliance runs one Piri per storage volume
# (docs/decisions/2026-10-multiple-piri-per-appliance.md), and this node has
# one: the object storage its Piri is to use. It is piri-0, by the naming that
# record sets, so a second can join without renaming the first.

x-piri-base: &piri-base
  image: ${PIRI_IMAGE}
  user: "0:0"
  entrypoint: ["/entrypoint.sh"]
  # Where `piri init` writes its config, which holds the chain RPC token. The
  # entrypoint copies it to the data dataset without the token.
  tmpfs: ["/run/piri-init:mode=0700"]
  environment: &piri-environment
    # Overrides of Piri's `[pdp]` config; see the dev node's compose.yml. The
    # token is the raw value; Piri prepends "Bearer ".
    PIRI_PDP_LOTUS_ENDPOINT: ${LOTUS_RPC_URL}
    PIRI_PDP_LOTUS_AUTH_TOKEN: ${CHAIN_RPC_TOKEN}
    PORT: 3000
    HOST: 0.0.0.0
    REGISTRAR_URL: ${REGISTRAR_URL}
    # Same variable Ingot's config is rendered from: one directory per host.
    PLC_DIRECTORY_URL: ${PLC_DIRECTORY_URL}
    OPERATOR_EMAIL: ${OPERATOR_EMAIL}
    PIRI_DB_BACKEND: postgres
    # Staging's backend until the object storage this node's Piri is to use is
    # wired in. The piri dataset's 50 GiB quota is sized for Piri's config and
    # state, not for blobs.
    PIRI_BLOB_BACKEND: filesystem
    # Seconds a re-run of `piri init` may take before it is killed and the
    # existing config served. Set PIRI_INIT_TIMEOUT in node.env to change it.
    PIRI_INIT_TIMEOUT: ${PIRI_INIT_TIMEOUT:-300}
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/readyz | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
    start_interval: 2s
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 180s
  # Limits give the capacity alerts a denominator and keep one service from
  # starving the shared host. Staging's sizes (FIL-1214).
  mem_limit: 2g
  cpus: 2
  restart: unless-stopped
  networks: [filone]

services:
  # The key, wallet and base config are rendered from OpenBao into a root-only
  # tmpfs by deploy-apps.sh; create_host_path: false makes a start after a
  # reboot fail until the first reconcile pass renders them. See the staging
  # node's compose.yml.
  piri-0:
    <<: *piri-base
    container_name: filone-piri-0
    environment:
      <<: *piri-environment
      PUBLIC_URL: https://piri-0.${PIRI_HOSTNAME_SUFFIX}
      # pool_max_conns sizes the PDP pipeline's connection pool, as on staging.
      # The entrypoint counts init's arguments among its inputs, so a change
      # here re-runs init on the next start.
      PIRI_DB_POSTGRES_URL: postgres://piri:${PIRI_POSTGRES_PASSWORD}@postgres:5432/piri_0?sslmode=disable&pool_max_conns=16
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=${FILONE_NODE}/piri-0
    volumes:
      - type: bind
        source: /run/fil-one/secrets/piri-0.pem
        target: /keys/piri.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-0-owner-wallet.hex
        target: /keys/owner-wallet.hex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/piri-base-config.toml
        target: /config/piri-base-config.toml
        read_only: true
        bind:
          create_host_path: false
      - ./config/piri/entrypoint.sh:/entrypoint.sh:ro
      # A directory on the piri dataset rather than its mount point, as on dev:
      # it exists only on the dataset, so Docker refuses to start the Piri
      # without it. provision-apps.sh creates it on the empty dataset.
      - type: bind
        source: /mnt/data/fil-one/piri/piri-0
        target: /data/piri
        bind:
          create_host_path: false

  ingot:
    image: ${INGOT_IMAGE}
    container_name: filone-ingot
    user: "0:0"
    command: ["serve", "--config", "/etc/ingot/config.yaml"]
    environment:
      # The node's Alloy, on the filone network, as on dev.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${STAGE}
    volumes:
      # Same tmpfs, same create_host_path reason, as the Piri's mounts above.
      - type: bind
        source: /run/fil-one/secrets/ingot.pem
        target: /keys/ingot.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/ingot-config.yaml
        target: /etc/ingot/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/fil-one/secrets/hilt-ingot-proof.txt
        target: /proofs/hilt-ingot-proof.txt
        read_only: true
        bind:
          create_host_path: false
      - /run/fil-one/bao:/run/openbao
      # Ingot keeps its spool and cache in data_dir/spool and data_dir/cache,
      # and its catalog log in data_dir/segments. The ingot/blobs dataset is
      # data_dir, so the spool and cache are what INGOT_LOCAL_BLOB_MAX_BYTES
      # budgets it for, and the ingot/segments dataset is bound over
      # data_dir/segments, so the catalog log has a quota of its own.
      - type: bind
        source: /mnt/data/fil-one/ingot/blobs
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/fil-one/ingot/segments
        target: /data/segments
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Staging's sizes. Twice the Piri's CPU: Ingot reached 1.3 cores in the
    # 2026-09-24 load test.
    mem_limit: 2g
    cpus: 4
    restart: unless-stopped
    networks: [filone]

networks:
  filone:
    external: true
