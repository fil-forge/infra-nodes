# Platform services for the dev node: OpenBao, Postgres, Caddy and Alloy.
#
# Everything Piri and Ingot need in order to exist. The apps project next door
# holds those two. Postgres and Caddy sit underneath them, so deploy-platform.sh
# waits for Piri's proving window and stops both apps before it applies a change
# here.
#
# Run through scripts/host/deploy-platform.sh, which supplies the env files and
# renders the secrets these definitions point at:
#   docker compose -p filone-platform \
#     --env-file ../node.env --env-file versions.env \
#     --env-file /run/filone/secrets/platform.env up -d
#
# Only Caddy publishes a port. Postgres is reachable on the filone network and
# nowhere else, and OpenBao is not on that network at all: the one thing that
# reaches its API is Ingot, over a unix socket on a shared bind mount.
name: filone-platform

services:
  # The node's root of trust. Holds every secret the node has, and unseals by
  # asking the central OpenBao to decrypt its seal key — which is why revoking
  # the node's token at central bricks this node on its next restart.
  openbao:
    image: ${OPENBAO_IMAGE}
    container_name: filone-openbao
    # Start the entrypoint as root so it can chown the bind mount below, which
    # cloud-init creates root-owned. It chowns /openbao/file, /openbao/config
    # and /openbao/logs and then drops to the `openbao` user, so the server
    # itself never runs as root and the raft path has to be one of those three.
    user: "0:0"
    command: ["server", "-config=/etc/openbao/bao.hcl"]
    environment:
      # Address, mount path and key name are in bao.hcl, which is committed. The
      # token is not, so it arrives here from the 0400 file provision-platform.sh
      # wrote at provision, by way of the rendered openbao.env.
      #
      # OpenBao renews this token itself while it runs, via a lifetime watcher
      # on the transit seal. The renewal timer on the host covers the case the
      # watcher cannot: a container that has been down longer than the token's
      # period.
      - VAULT_TRANSIT_SEAL_TOKEN=${SEAL_TOKEN}
    volumes:
      - ./config/openbao/bao.hcl:/etc/openbao/bao.hcl:ro
      - /mnt/filone/control/openbao:/openbao/file
      # Where the unix listener in bao.hcl puts its socket. Ingot mounts the
      # same host directory and dials the socket for every object key it wraps
      # or unwraps.
      #
      # /openbao/logs rather than a path of our own, for the same reason the
      # raft mount is /openbao/file: those are the paths the entrypoint chowns
      # before it drops privileges, so the server can create its socket there.
      #
      # Read-write, and so is Ingot's side: connecting to a socket on a
      # read-only bind mount is not dependably permitted, and the whole content
      # of this mount is one socket.
      - /run/filone/bao:/openbao/logs
    # No ports and no filone network. The TCP listener is on the container's
    # loopback, so the only way to reach this API from the host is `docker
    # exec`, which is root, and the only way in from another container is the
    # socket above.
    healthcheck:
      # `bao status` exits 0 unsealed, 2 sealed, 1 unreachable. Sealed is not
      # healthy: a sealed OpenBao serves nothing, and a deploy that proceeded
      # past it would render empty secrets into every config file.
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One Postgres for both applications, with a role and a database each. Piri
  # and Ingot are one node's worth of load; two instances would double the
  # memory for no isolation the roles do not already give.
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - /mnt/filone/control/postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. On a fresh data directory the image
      # runs a temporary bootstrap server on the unix socket only while initdb
      # runs; a socket-based pg_isready reports healthy during that window, so
      # postgres-init connects too early and psql exits 2.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d admin"]
      start_interval: 1s
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [filone]

  # Create the per-service roles and databases once Postgres is up. Idempotent:
  # guarded CREATEs via \gexec, because CREATE DATABASE cannot run inside a DO
  # block, plus an unconditional ALTER ROLE so a re-rendered password applies.
  # Passwords land inside SQL string literals, which is safe only because every
  # password this node generates is hex.
  postgres-init:
    image: ${POSTGRES_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_ADMIN_PASSWORD"
        ensure() {
          printf '%s\n' \
            "SELECT 'CREATE ROLE \"$$1\"' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$$1')" \
            '\gexec' \
            "ALTER ROLE \"$$1\" WITH LOGIN PASSWORD '$$2';" \
            "SELECT 'CREATE DATABASE \"$$1\" OWNER \"$$1\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$1')" \
            '\gexec' \
          | psql -h postgres -U admin -d admin -v ON_ERROR_STOP=1 --quiet
        }
        ensure piri "$$PIRI_POSTGRES_PASSWORD" &&
        ensure ingot "$$INGOT_POSTGRES_PASSWORD" &&
        echo "postgres roles + databases ready"
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PIRI_POSTGRES_PASSWORD: ${PIRI_POSTGRES_PASSWORD}
      INGOT_POSTGRES_PASSWORD: ${INGOT_POSTGRES_PASSWORD}
    restart: "no"
    networks: [filone]

  # The only listener on 0.0.0.0. Terminates TLS for both public hostnames and
  # obtains and renews their certificates over ACME.
  caddy:
    image: ${CADDY_IMAGE}
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PIRI_HOSTNAME=${PIRI_HOSTNAME}
      - INGOT_HOSTNAME=${INGOT_HOSTNAME}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. On the control volume so a
      # replaced instance serves the same certificates instead of re-issuing and
      # spending Let's Encrypt rate limit.
      - /mnt/filone/control/caddy/data:/data
      - /mnt/filone/control/caddy/config:/config
      # The node's status document, served at
      # /.well-known/filone-node-status.json. Read-only, and the Caddyfile's
      # exact path matcher exposes the one file rather than the directory.
      - /mnt/filone/control/state:/srv/filone/.well-known:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [filone]

  # Ships journald, container logs and host metrics to Grafana Cloud. Push-only
  # credentials: this is a one-way pipe out of the node.
  alloy:
    image: ${ALLOY_IMAGE}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - GRAFANA_LOGS_URL=${GRAFANA_LOGS_URL}
      - GRAFANA_LOGS_USER=${GRAFANA_LOGS_USER}
      - GRAFANA_METRICS_URL=${GRAFANA_METRICS_URL}
      - GRAFANA_METRICS_USER=${GRAFANA_METRICS_USER}
      - GRAFANA_PUSH_TOKEN=${GRAFANA_PUSH_TOKEN}
      - FILONE_NODE=${FILONE_NODE}
      - REGION_LABEL=${REGION_LABEL}
      # Prefix for the service_name label on every log stream and metric series
      # Alloy ships. Composed here so the format is written once instead of in
      # each relabel rule.
      - SERVICE_NAME_PREFIX=appliance-${STAGE}-${REGION_LABEL}
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, all three. Alloy discovers containers and reads their logs
      # through the socket, and needs the machine id to join journal entries to
      # a host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Where deploy scripts stamp deploy_last_success_timestamp.
      - /mnt/filone/control/state/metrics:/metrics:ro
      - /mnt/filone/control/alloy:/var/lib/alloy/data
      # The host's own filesystems, processes and devices, for the node
      # exporter. rslave so a volume mounted on the host after this container
      # started still shows up here; without it the appliance's EBS mounts would
      # be invisible and only the container's overlay would be reported.
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    networks: [filone]

# Created by cloud-init, declared external by both projects, owned by neither.
# `docker compose down` on either project must not take the other's network with
# it.
networks:
  filone:
    external: true
